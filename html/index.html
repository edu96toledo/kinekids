<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KineKids - Evaluación de Marcha Pediátrica</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Configuración de Tema Tailwind -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
            }
          }
        }
      }
    }
  </script>

  <!-- Estilos Personalizados (.css) -->
  <link rel="stylesheet" href="../css/styles.css">

  <!-- Manifiesto PWA -->
  <link rel="manifest" href="../manifest.json">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- ========================================================
       BARRA SUPERIOR (HEADER)
       ======================================================== -->
  <header id="app-header" class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm hidden no-print">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-16">
      
      <!-- LOGO Y TÍTULO -->
      <div class="flex items-center space-x-3 cursor-pointer" onclick="navigateTo(getDefaultViewForRole(currentRole))">
        <div class="w-10 h-10 rounded-2xl overflow-hidden shadow-md shadow-teal-500/20 border border-slate-100 flex-shrink-0">
          <img src="../img/kinekids-logo.jpg" onerror="this.src='../kinekids-logo.jpg'" alt="KineKids Logo" class="w-full h-full object-cover">
        </div>
        <div>
          <h1 class="text-xl font-bold bg-gradient-to-r from-teal-700 to-cyan-600 bg-clip-text text-transparent">KineKids</h1>
          <p class="text-xs text-slate-400 font-medium">Marcha Pediátrica Infantil • Telemedicina</p>
        </div>
      </div>

      <!-- PERFIL DE USUARIO Y BOTÓN SALIR -->
      <div class="flex items-center space-x-3">
        <span id="header-role-badge" class="hidden sm:inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-teal-50 text-teal-700 border border-teal-200">
          Rol: Padre
        </span>

        <div class="flex items-center space-x-2 pl-2 border-l border-slate-200">
          <div id="user-avatar" class="w-8 h-8 rounded-full bg-teal-600 text-white font-bold flex items-center justify-center text-xs shadow-sm">
            U
          </div>
          <div class="hidden md:block text-left">
            <span id="user-display-name" class="text-xs font-bold text-slate-800 block leading-tight">Usuario</span>
            <span id="user-display-id" class="text-[10px] text-slate-400 block">usuario@correo.com</span>
          </div>
        </div>

        <button onclick="handleLogout()" class="ml-2 p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition-all" title="Cerrar Sesión">
          <i class="fa-solid fa-arrow-right-from-bracket text-base"></i>
        </button>
      </div>

    </div>

    <!-- Navegación según Rol Activo -->
    <nav class="bg-slate-50 border-t border-slate-200 px-4 sm:px-8 py-2">
      <div class="max-w-7xl mx-auto flex items-center justify-between text-sm">
        <div id="nav-links" class="flex space-x-1 sm:space-x-4 overflow-x-auto pb-1 sm:pb-0">
          <!-- Inyectado dinámicamente por HeaderView.js -->
        </div>
        <div class="text-xs text-slate-500 hidden lg:flex items-center">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 mr-2 animate-pulse"></span>
          KineKids Telemedicina • Cumplimiento Ley 20.584
        </div>
      </div>
    </nav>
  </header>

  <!-- ========================================================
       CONTENEDOR PRINCIPAL
       ======================================================== -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col justify-center">
    <div id="app-content" class="w-full">
      <!-- Vistas renderizadas dinámicamente por js/views/* -->
    </div>
  </main>

  <!-- ========================================================
       MODAL GENÉRICO
       ======================================================== -->
  <div id="modal-container" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 no-print">
    <div id="modal-card" class="bg-white rounded-3xl max-w-2xl w-full p-6 shadow-2xl transform transition-all max-h-[90vh] overflow-y-auto custom-scrollbar">
      <!-- Inyectado dinámicamente -->
    </div>
  </div>

  <!-- ========================================================
       TOAST NOTIFICACIONES
       ======================================================== -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none no-print"></div>

  <!-- ========================================================
       ARQUITECTURA MVC - MODELOS (MODEL)
       ======================================================== -->
  <script src="../js/models/RutValidator.js"></script>
  <script src="../js/models/QuestionsModel.js"></script>
  <script src="../js/models/DatabaseModel.js"></script>
  <script src="../js/models/AuditModel.js"></script>
  <script src="../js/models/TriageModel.js"></script>

  <!-- ========================================================
       ARQUITECTURA MVC - VISTAS (VIEW)
       ======================================================== -->
  <script src="../js/views/ModalView.js"></script>
  <script src="../js/views/HeaderView.js"></script>
  <script src="../js/views/AuthView.js"></script>
  <script src="../js/views/ParentView.js"></script>
  <script src="../js/views/ClinicianView.js"></script>
  <script src="../js/views/AdminView.js"></script>
  <script src="../js/views/ReportView.js"></script>

  <!-- ========================================================
       ARQUITECTURA MVC - CONTROLADORES (CONTROLLER)
       ======================================================== -->
  <script src="../js/controllers/AppController.js"></script>
  <script src="../js/controllers/AuthController.js"></script>
  <script src="../js/controllers/ChildController.js"></script>
  <script src="../js/controllers/EvaluationController.js"></script>
  <script src="../js/controllers/ClinicianController.js"></script>
  <script src="../js/controllers/AdminController.js"></script>

  <!-- ========================================================
       BOOTSTRAP / INICIALIZACIÓN
       ======================================================== -->
  <script src="../js/app.js"></script>

  <!-- Service Worker PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../sw.js');
    }
  </script>
</body>
</html>
